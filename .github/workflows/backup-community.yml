# Free versioned backup of the Cloudflare KV community DB into this repo.
name: Backup community DB
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-community.yml'
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backups
          npx wrangler@4 kv key get db --namespace-id 5f508ed75ad149fcb35940f08a1c54e1 --remote > /tmp/kv.json || true
          python3 -c '
          import json, pathlib, datetime
          src = pathlib.Path("/tmp/kv.json")
          raw = src.read_text().strip() if src.exists() else ""
          try:
              data = json.loads(raw) if raw else {}
          except Exception:
              data = {}
          out = {
              "kind": "findexpert-community",
              "savedAt": datetime.datetime.utcnow().isoformat() + "Z",
              "host": "cloudflare-kv",
              "users": data.get("users") or {},
              "groups": data.get("groups") or {},
          }
          pathlib.Path("backups/community.json").write_text(json.dumps(out, indent=2, ensure_ascii=False) + "\n")
          '
      - name: Commit backup
        run: |
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add backups/community.json
          git diff --cached --quiet && echo no change || git commit -m "Backup community KV"
          git push
