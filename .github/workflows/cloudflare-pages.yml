# Deploys only when CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID are set as repo secrets.
# GitHub token cannot talk to Cloudflare.
name: Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Skip without Cloudflare token
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Cloudflare secrets not set. Site still deploys via GitHub Pages workflow."
      - name: Build and deploy
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run build
          npx wrangler pages deploy dist --project-name findexpert-ecoai
